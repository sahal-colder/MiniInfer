# Single product configuration. Format: key value; quotes and # comments work.
# Defaults < this file < --key value. Paths are relative to this file.
# python3 app/infer.py --check-config
# python3 app/infer.py build
# python3 app/infer.py run

# native | vllm | storage (build only, use the library through C/C++ API).
framework native
cuda yes
device cuda
# MiniInfer CUDA allocation: sync | async | pool.
# This does not replace vLLM's PyTorch GPU allocator.
memory-mode pool
c-api yes
# Build the preload library; this does not set LD_PRELOAD on the inference process.
preload yes
build-dir build
build-type Release
jobs 6
cmake cmake

# Native: llama2.c FP32 model.bin + matching tokenizer.bin.
# vLLM: local Hugging Face directory or model ID; tokenizer may be empty.
model ""
tokenizer ""
prompt "Once upon a time"
max-tokens 64
temperature 0
top-k 0
seed 42

# vLLM model execution; the connector currently supports one GPU/rank.
max-model-len 2048
gpu-memory-utilization 0.8
enforce-eager yes

# Shared SSD settings: native paged KV and vLLM offload.
# Native GPU KV budget; 0 derives capacity from model geometry.
gpu-cache-bytes 0
# Optional cuFile weight backend; actual GDS capability is reported separately.
cufile no
# posix | uring | auto | spdk. Explicit choices never silently change backend.
storage-engine posix
cpu-cache-bytes 268435456
# Physical record budget; includes record headers, pool rounding and SSD alignment.
# Pinned DMA staging and OS page cache are accounted separately.
ssd-bytes 34359738368
ssd-directory /tmp/miniinfer-kv
disk-buffer-slots 64
io-depth 8
file-shards 4
write-concurrency 4
ssd-verify on_read

# SPDK only, for both native and vLLM: SDK, JSON and bdev name.
# Empty SDK path uses normal pkg-config discovery.
spdk-sdk ""
spdk-config ""
spdk-bdev ""
spdk-reactor-mask 0x1
# auto | va | pa. Use va for unprivileged VFIO with IOMMU.
spdk-iova-mode auto
spdk-mem-mib 256
# Dedicated Linux NVMe. Set both to yes only for explicit file/malloc tests.
spdk-no-huge no
spdk-no-pci no
spdk-chunk-kib 256
